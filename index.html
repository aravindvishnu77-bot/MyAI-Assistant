
     <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      padding: 28px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 10px;
    }

    #status {
      color: #aaa;
      margin-bottom: 35px;
      min-height: 22px;
    }

    .orb {
      width: 190px;
      height: 190px;
      margin: auto;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 35% 30%,
          #fff,
          #00c8ff 20%,
          #06f 45%,
          #6a00ff 70%,
          #f0c
        );
      box-shadow:
        0 0 30px #08f,
        0 0 80px #5c00ff;
      animation: pulse 2s infinite;
    }

    .orb.listening {
      animation: pulse .8s infinite;
      box-shadow:
        0 0 45px #00d9ff,
        0 0 110px #5c00ff;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    button {
      margin-top: 45px;
      padding: 18px 35px;
      border: 0;
      border-radius: 50px;
      background: #fff;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #text {
      margin-top: 28px;
      min-height: 50px;
      color: #ddd;
      font-size: 18px;
      line-height: 1.5;
    }

    .controls {
      margin-top: 20px;
    }

    select {
      background: #171717;
      color: #fff;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
    }

    .hint {
      font-size: 13px;
      color: #777;
      margin-top: 18px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>My AI Assistant</h1>

  <div id="status">
    Tap the button and speak
  </div>

  <div id="orb" class="orb"></div>

  <button id="talkBtn">
    🎙️ Talk to me
  </button>
