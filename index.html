<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      padding: 28px;
    }

    h1 {
      font-size: 34px;
      margin: 0 0 10px;
    }

    #status {
      color: #aaa;
      margin-bottom: 35px;
      min-height: 22px;
    }

    .orb {
      width: 190px;
      height: 190px;
      margin: auto;
      border-radius: 50%;
      background: radial-gradient(
        circle at 35% 30%,
        #fff,
        #00c8ff 20%,
        #06f 45%,
        #6a00ff 70%,
        #f0c
      );
      box-shadow: 0 0 30px #08f, 0 0 80px #5c00ff;
      animation: pulse 2s infinite;
    }

    .orb.listening {
      animation: pulse .8s infinite;
      box-shadow:
        0 0 45px #00d9ff,
        0 0 110px #5c00ff;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    #text {
      margin-top: 28px;
      min-height: 70px;
      color: #ddd;
      font-size: 18px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .controls {
      margin-top: 20px;
    }

    select {
      background: #171717;
      color: #fff;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 15px;
    }

    .hint {
      font-size: 13px;
      color: #777;
      margin-top: 18px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Nova AI</h1>

  <div id="status">
    Starting Nova...
  </div>

  <div id="orb" class="orb"></div>

  <div id="text"></div>

  <div class="controls">
    <select id="language">
      <option value="en-US">English</option>
      <option value="ml-IN">Malayalam</option>
    </select>
  </div>

  <div class="hint">
    Say “Hey Nova” to talk. No button needed.
  </div>

</div>

<script>

const API_URL =
  "https://myai-assistant-8imo.onrender.com/api/chat";


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


const statusEl =
  document.getElementById("status");

const textEl =
  document.getElementById("text");

const orb =
  document.getElementById("orb");

const language =
  document.getElementById("language");


let recognition = null;
let restarting = false;


// -------------------------
// STATUS
// -------------------------

function setStatus(message) {
  statusEl.innerText = message;
}


// -------------------------
// NORMALIZE TEXT
// -------------------------

function normalize(text) {

  return text
    .toLowerCase()
    .replace(/[.,!?;:]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

}


// -------------------------
// CHECK HEY NOVA
// -------------------------

function hasWakeWord(text) {

  const value = normalize(text);

  return (
    value.includes("hey nova") ||
    value.includes("hi nova") ||
    value.includes("hey no va") ||
    value.includes("ഹേ നോവ") ||
    value.includes("ഹേയ് നോവ")
  );

}


// -------------------------
// REMOVE HEY NOVA
// -------------------------

function removeWakeWord(text) {

  return text

    .replace(/hey[\s,]*nova/ig, "")

    .replace(/hi[\s,]*nova/ig, "")

    .replace(
      /hey[\s,]*no[\s-]*va/ig,
      ""
    )

    .replace(
      /ഹേയ്?\s*നോവ/ig,
      ""
    )

    .trim();

}


// -------------------------
// START LISTENING
// -------------------------

function startListening() {

  if (!recognition || restarting) {
    return;
  }

  try {

    recognition.lang =
      language.value;

    recognition.start();

  } catch (error) {

    console.log(error);

  }

}


// -------------------------
// SPEECH SUPPORT
// -------------------------

if (!SpeechRecognition) {

  setStatus(
    "Speech recognition is not supported."
  );

} else {

  recognition =
    new SpeechRecognition();


  recognition.continuous = true;

  recognition.interimResults = false;

  recognition.maxAlternatives = 3;


  // -------------------------
  // START
  // -------------------------

  recognition.onstart =
    function() {

      restarting = false;

      orb.classList.add(
        "listening"
      );

      setStatus(
        'Listening… say "Hey Nova"'
      );

    };


  // -------------------------
  // RESULT
  // -------------------------

  recognition.onresult =
    async function(event) {

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        if (
          !event.results[i].isFinal
        ) {
          continue;
        }


        const heard =
          event.results[i][0]
            .transcript
            .trim();


        console.log(
          "Heard:",
          heard
        );


        // Wait for Hey Nova

        if (
          !hasWakeWord(heard)
        ) {

          continue;

        }


        // Remove wake word

        const command =
          removeWakeWord(
            heard
          );


        // If user only said Hey Nova

        if (!command) {

          setStatus(
            "Yes? I'm listening..."
          );

          speak(
            "Yes, I am listening.",
            language.value
          );

          continue;

        }


        // Show user command

        textEl.innerText =
          "You: " + command;


        setStatus(
          "Thinking... 🤖"
        );


        try {

          recognition.stop();

        } catch (error) {}


        await askAI(
          command
        );

      }

    };


  // -------------------------
  // ERROR
  // -------------------------

  recognition.onerror =
    function(event) {

      console.log(
        "Speech error:",
        event.error
      );


      orb.classList.remove(
        "listening"
      );


      if (
        event.error ===
          "not-allowed" ||

        event.error ===
          "service-not-allowed"
      ) {

        setStatus(
          "Please allow microphone permission."
        );

        return;

      }


      restartListening();

    };


  // -------------------------
  // END
  // -------------------------

  recognition.onend =
    function() {

      orb.classList.remove(
        "listening"
      );


      restartListening();

    };


  // -------------------------
  // RESTART
  // -------------------------

  function restartListening() {

    if (restarting) {
      return;
    }


    restarting = true;


    setTimeout(
      function() {

        restarting = false;

        startListening();

      },
      1000
    );

  }


  // Start automatically

  setTimeout(
    function() {

      startListening();

    },
    1000
  );

}


// -------------------------
// ASK AI
// -------------------------

async function askAI(message) {

  try {

    const response =
      await fetch(
        API_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            message: message,

            language:
              language.value

          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Server error"
      );

    }


    const answer =
      data.answer ||
      "I couldn't generate an answer.";


    textEl.innerText +=
      "\n\nNova: " +
      answer;


    speak(
      answer,
      language.value
    );


  } catch (error) {

    console.error(error);


    textEl.innerText +=
      "\n\n" +
      error.message;


    setStatus(
      "Connection problem"
    );


    restartListening();

  }

}


// -------------------------
// SPEAK
// -------------------------

function speak(
  text,
  lang
) {

  speechSynthesis.cancel();


  const voice =
    new SpeechSynthesisUtterance(
      text
    );


  voice.lang = lang;

  voice.rate = 1;

  voice.pitch = 1;


  setStatus(
    "Speaking... 🔊"
  );


  voice.onend =
    function() {

      setStatus(
        'Say "Hey Nova"'
      );


      orb.classList.remove(
        "listening"
      );


      setTimeout(
        startListening,
        500
      );

    };


  speechSynthesis.speak(
    voice
  );

}


// -------------------------
// LANGUAGE CHANGE
// -------------------------

language.addEventListener(
  "change",
  function() {

    if (!recognition) {
      return;
    }


    try {

      recognition.stop();

    } catch (error) {}

  }
);

</script>

</body>
</html>
